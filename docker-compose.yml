version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: reservas-db
    environment:
      POSTGRES_USER: admin_reserva
      POSTGRES_PASSWORD: senha_segura123
      POSTGRES_DB: db_reservas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: reservas-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/db_reservas
      - SPRING_DATASOURCE_USERNAME=admin_reserva
      - SPRING_DATASOURCE_PASSWORD=senha_segura123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - db

volumes:
  postgres_data: